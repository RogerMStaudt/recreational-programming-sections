<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="hangman.css">
</head>
<body>
    <div id="container">
        <button onclick="generate()">Generate Word</button>

        <div id="region-word"></div>
        <input id="hidden-word" type="hidden">

        <div id="keyboard">
            <button onclick="keyClick('Q')" class="key">Q</button>
            <button onclick="keyClick('W')" class="key">W</button>
            <button onclick="keyClick('E')" class="key">E</button>
            <button onclick="keyClick('R')" class="key">R</button>
            <button onclick="keyClick('T')" class="key">T</button>
            <button onclick="keyClick('Y')" class="key">Y</button>
            <button onclick="keyClick('U')" class="key">U</button>
            <button onclick="keyClick('I')" class="key">I</button>
            <button onclick="keyClick('O')" class="key">O</button>
            <button onclick="keyClick('P')" class="key">P</button>
            <br>
            <button onclick="keyClick('A')" class="key">A</button>
            <button onclick="keyClick('S')" class="key">S</button>
            <button onclick="keyClick('D')" class="key">D</button>
            <button onclick="keyClick('F')" class="key">F</button>
            <button onclick="keyClick('G')" class="key">G</button>
            <button onclick="keyClick('H')" class="key">H</button>
            <button onclick="keyClick('J')" class="key">J</button>
            <button onclick="keyClick('K')" class="key">K</button>
            <button onclick="keyClick('L')" class="key">L</button>
            <br>
            <button onclick="keyClick('Z')" class="key">Z</button>
            <button onclick="keyClick('X')" class="key">X</button>
            <button onclick="keyClick('C')" class="key">C</button>
            <button onclick="keyClick('V')" class="key">V</button>
            <button onclick="keyClick('B')" class="key">B</button>
            <button onclick="keyClick('N')" class="key">N</button>
            <button onclick="keyClick('M')" class="key">M</button>
        </div>
    </div>
    
    <script src="hangman.js"></script>
</body>
</html>
