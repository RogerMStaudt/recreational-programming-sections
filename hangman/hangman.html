<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="hangman.css">
</head>
<body>
    <div id="container">
        <button onclick="generate()">Generate Word</button>

        <div id="region-word"></div>
        <input id="answer" type="hidden">

        <div id="keyboard">
            <button onclick="keyClick(this)" class="key">Q</button>
            <button onclick="keyClick(this)" class="key">W</button>
            <button onclick="keyClick(this)" class="key">E</button>
            <button onclick="keyClick(this)" class="key">R</button>
            <button onclick="keyClick(this)" class="key">T</button>
            <button onclick="keyClick(this)" class="key">Y</button>
            <button onclick="keyClick(this)" class="key">U</button>
            <button onclick="keyClick(this)" class="key">I</button>
            <button onclick="keyClick(this)" class="key">O</button>
            <button onclick="keyClick(this)" class="key">P</button>
            <br>
            <button onclick="keyClick(this)" class="key">A</button>
            <button onclick="keyClick(this)" class="key">S</button>
            <button onclick="keyClick(this)" class="key">D</button>
            <button onclick="keyClick(this)" class="key">F</button>
            <button onclick="keyClick(this)" class="key">G</button>
            <button onclick="keyClick(this)" class="key">H</button>
            <button onclick="keyClick(this)" class="key">J</button>
            <button onclick="keyClick(this)" class="key">K</button>
            <button onclick="keyClick(this)" class="key">L</button>
            <br>
            <button onclick="keyClick(this)" class="key">Z</button>
            <button onclick="keyClick(this)" class="key">X</button>
            <button onclick="keyClick(this)" class="key">C</button>
            <button onclick="keyClick(this)" class="key">V</button>
            <button onclick="keyClick(this)" class="key">B</button>
            <button onclick="keyClick(this)" class="key">N</button>
            <button onclick="keyClick(this)" class="key">M</button>
        </div>
    </div>
    
    <script src="hangman.js"></script>
</body>
</html>
